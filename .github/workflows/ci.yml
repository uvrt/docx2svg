name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install -e .[dev]

      # The open metric compatible substitutes (README.md, "Fonts"): with them the layout
      # code runs past the first paragraph on a runner without Office's faces, and
      # tests/test_substitutes.py holds Carlito's layout to Word's Calibri numbers.  Never
      # a font file in the repository.  Windows has Calibri, Arial, Times New Roman and
      # Courier New itself, so there the real faces are laid out with and nothing is added.
      - name: Install the open substitute fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - name: Install the open substitute fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-carlito font-caladea font-liberation

      # The oracle needs Microsoft Word, which no runner has -- including the macOS one.
      # Every test that needs it skips (tests/conftest.py), so this matrix checks the
      # reader, the units, the fixture generator and -- with the substitutes above -- the
      # layout code on twelve legs, and checks fidelity only where it is recorded (Word's
      # observations under tests/fixtures/).  That gap is real and ROADMAP.md says so:
      # correctness is established on the one Mac that has Word, and CI only catches
      # regressions in what can be checked without it.
      - name: Test
        run: python -m pytest -q

      - name: The fixture is regenerable and the committed one is current
        shell: bash  # the default on Windows is PowerShell, which this script is not
        # The archive's bytes are deflate's.  CPython 3.14+ on Windows deflates with zlib-ng,
        # whose bytes differ from zlib's for the same parts; there the diff leaves the .docx
        # out, and tests/test_parse.py's part-by-part comparison is the check.
        run: |
          python tools/make_layout_sweep.py
          if python -c "import sys, zlib; sys.exit(hasattr(zlib, 'ZLIBNG_VERSION'))"; then
            git diff --exit-code tests/fixtures/
          else
            echo "deflate is zlib-ng: tests/fixtures/*.docx compared part by part (tests/test_parse.py)"
            git diff --exit-code tests/fixtures/ ':(exclude)tests/fixtures/*.docx'
          fi || (echo "tests/fixtures/ is stale: rerun tools/make_layout_sweep.py" && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
