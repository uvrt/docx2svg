name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install -e .[dev]

      # The oracle needs Microsoft Word, which no runner has -- including the macOS one.
      # Every test that needs it skips (tests/conftest.py), so this matrix checks the
      # reader, the units and the fixture generator on twelve legs and checks *nothing*
      # about fidelity.  That gap is real and ROADMAP.md says so: correctness is
      # established on the one Mac that has Word, and CI only catches regressions in
      # what can be checked without it.
      - name: Test
        run: python -m pytest -q

      - name: The fixture is regenerable and the committed one is current
        run: |
          python tools/make_layout_sweep.py
          git diff --exit-code tests/fixtures/ || \
            (echo "tests/fixtures/ is stale: rerun tools/make_layout_sweep.py" && exit 1)

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
