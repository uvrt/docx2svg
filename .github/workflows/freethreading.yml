name: Free threading

# The suite on the free-threaded build of Python (3.15t), with the GIL off.  A separate
# workflow on purpose: ci.yml's jobs are the required checks of branch protection, and
# this one is not required (yet).  The first step checks that importing the package and
# the extras' modules leaves the GIL off, without PYTHON_GIL set (an extension that has
# not declared itself free-threading safe turns the GIL back on, with a RuntimeWarning).
# The suite then runs with PYTHON_GIL=0 and RuntimeWarning an error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, half an hour after ci.yml's own (staggered as its crons are), with macOS
  # too, which a pull request leaves out.
  schedule:
    - cron: "17 3 * * *"

# One run per pull request at a time: a new push to it cancels the run for the push
# before.  A push to main, the nightly run and a manual run are never cancelled and never
# wait: their group ends in the run's own id (a group keeps one pending run and drops the
# one before it, so a shared group would drop a queued run of main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, 3.15t)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu only on a pull request (macOS runners are the scarce ones); both on a
        # push to main, the nightly run and a manual run.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15t"
          allow-prereleases: true

      # As ci.yml installs them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          python -m pip install -e .[dev]

      # The fonts come from the apt mirror once, then from the Actions cache, so a mirror
      # outage cannot turn a run red: on a miss apt installs them (with retries) and every
      # file the packages put under the font and fontconfig directories is cached with its
      # path; on a hit those files go back to the same paths and apt is not touched.
      - name: Restore the open substitute fonts from the cache (Linux)
        id: substitute-fonts
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: ~/substitute-fonts
          key: substitute-fonts-${{ runner.os }}-fonts-crosextra-carlito-fonts-crosextra-caladea-fonts-liberation-v1
      - name: Install the open substitute fonts (Linux)
        if: runner.os == 'Linux' && steps.substitute-fonts.outputs.cache-hit != 'true'
        run: |
          packages="fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation"
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          mkdir -p ~/substitute-fonts
          dpkg -L $packages | grep -E '^/(usr/share/fonts|usr/share/fontconfig|etc/fonts)/' |
            while read -r f; do
              if [ -f "$f" ] || [ -L "$f" ]; then cp -d --parents "$f" ~/substitute-fonts/; fi
            done
      - name: Save the open substitute fonts to the cache (Linux)
        if: runner.os == 'Linux' && steps.substitute-fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/substitute-fonts
          key: ${{ steps.substitute-fonts.outputs.cache-primary-key }}
      - name: Put the cached substitute fonts in place and check them (Linux)
        if: runner.os == 'Linux'
        env:
          CACHE_HIT: ${{ steps.substitute-fonts.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            sudo cp -dR ~/substitute-fonts/. /
            sudo fc-cache -f
          fi
          fc-list : family style file | grep -E 'Carlito|Caladea|Liberation' | sort
          for family in Carlito Caladea "Liberation Sans" "Liberation Serif" "Liberation Mono"; do
            fc-list "$family" family | grep -q . || { echo "missing font: $family"; exit 1; }
          done
      - name: Install the open substitute fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-carlito font-caladea font-liberation

      - name: Importing the package leaves the GIL off
        run: |
          python -W error::RuntimeWarning - <<'PY'
          import importlib, pkgutil, sys
          assert hasattr(sys, "_is_gil_enabled"), "not a free-threaded build"
          import docx2svg as package
          for module in pkgutil.walk_packages(package.__path__, package.__name__ + "."):
              if not module.name.endswith("__main__"):
                  importlib.import_module(module.name)
          # The extras' modules: png, oracle, measure, and the dev extra's.
          import resvg_py, pypdfium2, fontTools.ttLib, numpy  # noqa: F401
          print(sys.version)
          sys.exit("the GIL is enabled" if sys._is_gil_enabled() else 0)
          PY

      - name: Test
        env:
          PYTHON_GIL: "0"
        run: python -W error::RuntimeWarning -m pytest -q -W error::RuntimeWarning
